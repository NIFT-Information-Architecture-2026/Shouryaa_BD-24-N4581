<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft chalk dust gradient for tactile blackboard depth -->
    <radialGradient id="chalkHalo" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#5EB88A" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#FAF8F5" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#121514" stop-opacity="0" />
    </radialGradient>
    
    <!-- Organic tactile chalk grain filter -->
    <filter id="chalkTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Dark Chalkboard Squircle Tile -->
  <rect x="2" y="2" width="124" height="124" rx="28" ry="28" fill="#121514" stroke="rgba(250, 248, 245, 0.12)" stroke-width="1.5" />
  
  <!-- Subtle Soft Atmospheric Glow Behind Sprout -->
  <rect x="2" y="2" width="124" height="124" rx="28" ry="28" fill="url(#chalkHalo)" />
  <ellipse cx="64" cy="62" rx="42" ry="34" fill="#FAF8F5" opacity="0.025" />

  <!-- Handcrafted Chalk Sprout & Flowing Loop Baseline -->
  <g transform="translate(64, 62) scale(1.18) translate(-50, -50)" filter="url(#chalkTexture)">
    <!-- Left Leaf (Sage/Mint Chalk Fill) -->
    <path d="M 49 48.5 C 44 41, 37 34, 21.5 37.5 C 19 44.5, 27 52, 47.5 52 Z" 
          fill="#5EB88A" opacity="0.92" />
    <!-- Left Leaf Outer Chalk Contour -->
    <path d="M 48.5 48.5 C 44 41, 37 34, 21.5 37.5 C 19 44.5, 27 52, 47.5 52" 
          fill="none" stroke="#FAF8F5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Left Leaf Chalk Central Vein -->
    <path d="M 46.5 50 C 38.5 46, 30.5 41.5, 23 38" 
          fill="none" stroke="#FAF8F5" stroke-width="1.4" stroke-linecap="round" opacity="0.95" />

    <!-- Right Leaf (Slightly larger, sweeping upward) -->
    <!-- Right Leaf Chalk Fill -->
    <path d="M 50.5 47.5 C 58.5 36.5, 66 28.5, 79 24.5 C 81 33.5, 72 45.5, 51.5 51.5 Z" 
          fill="#5EB88A" opacity="0.92" />
    <!-- Right Leaf Outer Chalk Contour -->
    <path d="M 50.5 47.5 C 58.5 36.5, 66 28.5, 79 24.5 C 81 33.5, 72 45.5, 51.5 51.5" 
          fill="none" stroke="#FAF8F5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Leaf Chalk Central Vein -->
    <path d="M 51.5 50 C 61 40.5, 70.5 32.5, 77.5 25.5" 
          fill="none" stroke="#FAF8F5" stroke-width="1.4" stroke-linecap="round" opacity="0.95" />

    <!-- Slender Upright Bud Shoot -->
    <path d="M 50 48.5 L 50 36.5" 
          stroke="#5EB88A" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 49.6 48 L 49.6 37.5" 
          stroke="#FAF8F5" stroke-width="1.1" stroke-linecap="round" opacity="0.85" />

    <!-- Curving Stem -->
    <path d="M 50 48.5 C 49.5 57, 48.5 65.5, 47.2 72.5" 
          fill="none" stroke="#5EB88A" stroke-width="3.6" stroke-linecap="round" />
    <path d="M 49.8 48.5 C 49.3 57, 48.3 65.5, 47 72.5" 
          fill="none" stroke="#FAF8F5" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />

    <!-- Organic Flowing Chalk Ground Line with Loop Swirl -->
    <!-- Sweeps gently from left, curves through stem base, rises into graceful cursive loop, and tapers off -->
    <path d="M 16 70.5 C 27 61.5, 37.5 66.5, 47.2 72.5 C 52 75.5, 60.5 76, 67.5 73 C 73.5 70, 78 64, 76 59 C 74 54, 68 54.5, 66.5 60.5 C 65.5 66.5, 70.5 72.5, 76.5 73.5 C 81 74, 85.5 72.5, 89.5 66.5" 
          fill="none" stroke="#FAF8F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
