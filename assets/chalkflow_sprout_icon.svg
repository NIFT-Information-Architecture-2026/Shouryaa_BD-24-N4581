<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft chalk dust gradient for tactile blackboard depth -->
    <radialGradient id="chalkHalo" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#5EB88A" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#FAF8F5" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#121514" stop-opacity="0" />
    </radialGradient>
    
    <!-- Organic tactile chalk grain filter -->
    <filter id="chalkTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Dark Chalkboard Squircle Tile -->
  <rect x="2" y="2" width="124" height="124" rx="28" ry="28" fill="#121514" stroke="rgba(250, 248, 245, 0.12)" stroke-width="1.5" />
  
  <!-- Soft Atmospheric Vignette -->
  <rect x="2" y="2" width="124" height="124" rx="28" ry="28" fill="url(#chalkHalo)" />
  <ellipse cx="64" cy="62" rx="38" ry="32" fill="#FAF8F5" opacity="0.025" />

  <!-- Compact Hand-Drawn Sprout Symbol (Pure sprout & base loop, no squeezed wavy line) -->
  <g transform="translate(64, 62) scale(1.18) translate(-50, -50)" filter="url(#chalkTexture)">
    <!-- Left Leaf (Angled up-left, soft sage fill with chalk contour) -->
    <path d="M 48.5 54 C 44 45, 37 38, 22 42 C 20 48, 28 56, 47.5 56 Z" 
          fill="#5EB88A" opacity="0.94" />
    <path d="M 48.5 54 C 44 45, 37 38, 22 42 C 20 48, 28 56, 47.5 56" 
          fill="none" stroke="#FAF8F5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Leaf (Taller, longer, sweeping up-right with sharp pointed tip) -->
    <path d="M 50.5 53 C 58 40, 66 31, 80 26 C 82 35, 73 48, 51.5 55.5 Z" 
          fill="#5EB88A" opacity="0.94" />
    <path d="M 50.5 53 C 58 40, 66 31, 80 26 C 82 35, 73 48, 51.5 55.5" 
          fill="none" stroke="#FAF8F5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Slender Upright Bud / Center Shoot -->
    <path d="M 49.6 54 L 49.6 42" 
          stroke="#5EB88A" stroke-width="3" stroke-linecap="round" />
    <path d="M 49.6 54 L 49.6 42" 
          stroke="#FAF8F5" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />

    <!-- Vertical Stem -->
    <path d="M 49.5 54 L 49.5 76" 
          stroke="#5EB88A" stroke-width="3.4" stroke-linecap="round" />
    <path d="M 49.5 54 L 49.5 76" 
          stroke="#FAF8F5" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

    <!-- Organic Stem Base Loop (From continuous-line illustration) -->
    <path d="M 49.5 76 C 49 81, 46 84, 43 82 C 40 79, 42 74, 48 74 C 54 74, 57 79, 54 83 C 51 86, 46 85, 43 81" 
          fill="none" stroke="#FAF8F5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
